[platformio]
src_dir = .
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
; TODO: Confirm this board ID for your exact ESP32 before uploading.
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  adafruit/Adafruit MPU6050

build_src_filter =
  +<hardware/*.cpp>
  +<alerts/*.cpp>
  +<logic/*.cpp>